<!DOCTYPE html>
<html lang="en">
<head>
<title>MacBuddy</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
<script defer src="app.js"></script>
</head>
<body>
<div class="desktop-bg">
  <main class="app-frame match-shell">
    <div class="dynamic-island"></div>
    <div class="statusbar">
      <strong>9:41</strong>
      <span>▮▮▮ ⌁ ▰</span>
    </div>
    
<section class="match-page">
  <div class="match-hero">
    <a class="back-white" href="index.html">‹</a>
    <p>IT'S A MATCH</p>
    <h1>You're connected!</h1>
    <div class="paired">
      <div class="big-avatar coral">S</div>
      <div class="heart">♥</div>
      <div class="big-avatar blue" id="match-avatar">A</div>
    </div>
  </div>
  <div class="content">
    <p class="center-note">You and <strong id="match-name">Sara</strong> are <span id="match-percent">98%</span> compatible</p>
    <h2>Break the ice</h2>
    <p class="subtext">Pick a starter question — no awkward “hey” required.</p>
    <div class="question-list">
      <label class="question selected-question"><span>☕</span><b>Matcha or coffee, where's the best spot on campus?</b><input type="radio" name="q" checked><i></i></label>
      <label class="question"><span>📚</span><b>What's your go-to study spot on campus?</b><input type="radio" name="q"><i></i></label>
      <label class="question"><span>✨</span><b>One club you've been meaning to try?</b><input type="radio" name="q"><i></i></label>
    </div>
    <a class="primary page-bottom" href="quest.html">Send icebreaker</a>
  </div>
</section>

    <nav class="bottom-nav">
      <a class="nav-item " href="index.html">⌂<span>Discover</span></a>
      <a class="nav-item selected" href="connections.html">♡<span>Connections</span></a>
      <a class="nav-item " href="messages.html">▢<span>Messages</span></a>
      <a class="nav-item " href="profile.html">♙<span>Profile</span></a>
    </nav>
    <div class="home-indicator"></div>
  </main>
</div>
</body>
</html>
